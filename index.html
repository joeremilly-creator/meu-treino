<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Treino</title>
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Voltar" hidden>‹</button>
    <h1 id="title">Meu Treino</h1>
  </header>

  <main id="view"></main>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="sheet" hidden></div>

  <div class="toast" id="toast" hidden></div>

  <div class="rest" id="rest" hidden>
    <div class="rest-label">Descanso</div>
    <div class="rest-time" id="restTime">0:50</div>
    <div class="rest-actions">
      <button id="restMinus">−10s</button>
      <button id="restPlus">+10s</button>
      <button id="restSkip" class="primary">Pular</button>
    </div>
  </div>

  <nav class="tabs">
    <a href="#/" data-tab="home"><span>🏠</span>Treinos</a>
    <a href="#/exercicios" data-tab="exercicios"><span>💪</span>Exercícios</a>
    <a href="#/desempenho" data-tab="desempenho"><span>📈</span>Desempenho</a>
    <a href="#/ajustes" data-tab="ajustes"><span>⚙️</span>Ajustes</a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="exercises.js"></script>
  <script src="exercises-extra.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
